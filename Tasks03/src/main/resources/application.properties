spring.application.name=NauJava
app.name=Assets)
app.version=0.1

management.endpoints.web.exposure.include=*

spring.datasource.url=jdbc:postgresql://localhost:5432/assets
spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Включаем инициализацию для внешней БД (PostgreSQL)
#spring.sql.init.mode=always
# Указываем путь к файлу (если имя не schema.sql)
#spring.sql.init.schema-locations=classpath:schema.sql

!spring.jpa.hibernate.ddl-auto=update

springdoc.packagesToScan=ru.chepusov.NauJava.controller
spring.data.rest.detection-strategy=annotated