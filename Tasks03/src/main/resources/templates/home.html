<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChAS homepage)</title>
</head>
<body>
<h1>Стартовая страница проекта FINAL (FINancial AnaLytic)</h1>
<br>

<div th:if="${param.logout != null and param.logout[0] == 'done'}">
    Вы успешно вышли из системы!  <br>
    <br>
</div>

<div th:if="${currentUser == null}">
    <b>Авторизуйтесь для получения полного функционала.</b><br>
    <br>
</div>



<a href = "/users/view">См. список пользователей</a> <br>
<a th:if = "${currentUser == null}"  href = "/login">Войти в систему</a> <br>
<a th:if = "${currentUser == null}" href = "/register">Зарегистрироваться в системе</a> <br><br>
<a href = "/profile">Данные о текущем пользователе</a> <br><br>

<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>


</body>
</html>
