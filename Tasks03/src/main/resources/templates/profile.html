<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>User profile</title>
</head>

<body>
<p th:object="${currentUser}">
    <h2  th:text="|Добро пожаловать, *{login}!!!|">Вы авторизованы как пользователь</h2>
    <h3>Ваши данные:</h3>
    <span th:text="|Вы авторизовались как ${currentUser?.getFirstName()} ${currentUser?.lastName}, ${currentUser.age} лет. |">User data...</span> <br>
    <span th:text="|Зашифрованный пароль хранится в виде ${currentUser.password}|">Pass...</span><br>
    <p th:text="|Роли пользователя: ${currentUser.roles}|">Other data...</p><br>
    <!-- <p th:text="|Ваши счета: |">Other data...</p><br> -->
    <p><u>Ваши счета:</u><br>
        <!-- <span th:each="acc : *{currentUser.accounts}" th:text="|*{acc.name}|\n">Что-то пошло не так...</span> -->
        <span th:each="acc : ${currentUser.accounts}">
            <span th:text="${acc.name}"></span><br>
        </span>

    </p><br>
</p>
Для выхода нажмите кнопку
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
