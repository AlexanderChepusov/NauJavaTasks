<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>User profile</title>
</head>

<body>
<p th:object="${currentUser}">
    <h2  th:text="|Добро пожаловать, ${currentUser?.login}!|">Вы авторизованы как пользователь</h2>
    <h3>Ваши данные:</h3>
    <span th:text="|ID = ${currentUser?.id}|"></span><br>
    <span th:text="|Вы авторизовались как ${currentUser?.getFirstName()} ${currentUser?.lastName}, ${currentUser.age} лет. |">User data...</span> <br>
    <span th:text="|Зашифрованный пароль хранится в виде ${currentUser.password}|">Pass...</span>
    <div th:text="|Роли пользователя: ${currentUser.roles}|">Other data...</div>
    <!-- <p th:text="|Ваши счета: |">Other data...</p><br> -->
    <div><u>Ваши счета:</u><br>
        <!--span th:text="${currentUser.accounts}">...счета пользователя....</span><br> -->
        <!--span th:text="${accInfo}">...попытка номер 2....</span><br> -->
        <!--span th:each="acc : *{currentUser.accounts}" th:text="|*{acc.name}|\n">Что-то пошло не так...</span> -->
        <span th:each="acc : ${currentUser.accounts}">
            <span th:text="${acc.name}">smth...</span><br>
        </span>
    </div>
    <form method="post" th:action="@{/newAccount}">
        <input type="text" name="name" placeholder="Название счета (name)">
        <input type="text" name="type" placeholder="Тип счета">
        <input type="date" name = "expDate" placeholder="Срок действия (до)"><br>
        <input type="submit" value="Добавить новй счет">
    </form>
</p>
<form th:object="${currentUser}" th:action="@{/operations/{id}(id=${currentUser.id})}" method="get">
    <button type="submit">Перейти к списку операций</button>
</form>
<br>

Для выхода нажмите кнопку
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
