<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>User profile</title>
</head>

<body>
<p th:object="${user}">
    <span  th:text="|Hello, *{firstName}!!!|">Вы авторизованы как пользователь</span><br>
    <h3>Ваши данные:</h3><br>
    <span th:text="|Вы авторизовались как ${user?.getFirstName()} ${user?.lastName}, ${user.age} лет. |">User data...</span> <br>
    <span th:text="|Зашифрованный пароль хранится в виде ${user.password}|">Pass...</span><br>
    <p th:text="|Роли пользователя: ${user.roles}|">Other data...</p><br>
</p>
Для выхода нажмите кнопку
<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
