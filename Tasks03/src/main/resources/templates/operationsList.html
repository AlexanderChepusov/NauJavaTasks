<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Операции</title>
</head>
<body>
<header>
    <h1 th:text="---|Пользователь ${currentUser.firstName} ${currentUser.lastName} (${currentUser.login})|---">Пользователь неизвестен...</h1>
    <!--
    <p>Который сделан на основе готового шаблона</p>
    <nav>
        <ul>
            <li><a href="index.html">Эта страница</a></li>
            <li><a href="catalog.html">Другая страница</a></li>
        </ul>
    </nav>
    -->
</header>

<h2>Добавить новую операцию</h2>

<form th:action="@{/operations/new}" method="post" th:object="${operation}">
    <table border="1" th:object="operation">
        <thead>
            <tr>
                <b>
                    <th><label for="type">Вид</label></th>
                    <th><label for="amount">Сумма</label></th>
                    <th><label for="category">Категория</label></th>
                    <th><label for="account">Счет</label></th>
                    <th><label for="marketplace">Магазин</label></th>
                </b>
            </tr>
        </thead>
        <tbody>
            <tr>



                <!--
        Введите уникальный логин: <input type="text" name = "login" th:field="*{login}" placeholder="Введите Логин" id="login"/><br>
                -->

                <td>
                    <select id="type" name="*{type}" >
                    <!--option value="">-- Пожалуйста, выберите вариант --</option-->
                        <option value="payment">Покупка</option>
                        <option value="income">Доход</option>
                        <option value="saving">Накопление</option>
                    </select>
                </td>
                <td><input type="text" name="*{amount}" id = "amount" placeholder="Сумма"></td>
                <td>
                    <select id="category" name="category">
                        <!--option value="">-- Пожалуйста, выберите вариант --</option-->
                        <option th:each="cat : ${catList}"
                                th:value="${cat.name}"
                                th:text="${cat.name}"></option>
                        <!--option value="*{catList.name}"></option-->
                        <!--option value="payment">Покупка</option-->

                    </select>
                </td>
                <td>Счет
                    <select id="account" th:field="*{account.id}">
                        <option th:each="acc : ${accountsList}"
                                th:value="${acc.id}"
                                th:text="${acc.name}"></option>
                    </select>Категория
                </td>
                <td>
                    <select id="marketplace" th:field="*{marketplace.id}">
                        <option th:each="acc : ${accountsList}"
                                th:value="${acc.id}"
                                th:text="${acc.name}"></option>
                    </select>
                </td>
            </tr>
        </tbody>
    </table><input type="submit" value="Создать">
</form>

<h3>------------------------------------------------------------------------------</h3>

<h2>Операции пользователя</h2>

<table border="1">
    <thead>
    <tr>
        <b>
            <th>N</th>
            <th>Дата</th>
            <th>Тип</th>
            <th>Цена</th>
            <th>Категория</th>
            <th>Счет</th>
            <th>Магазин</th>
        </b>
    </tr>
    </thead>
    <tbody>
    <!-- Цикл по списку usersList -->
    <tr th:each="op : ${operations}">
        <td th:text="${op.id}">-1</td>
        <td th:text="${op.dateTime}">Дата/Время</td>
        <td th:text="${op.type}">Расход/Приход</td>
        <td th:text="${op.amount}">Цена</td>
        <td th:text="${op.category.name}">Категория</td>
        <td th:text="${op.account.name}">Счет</td>
        <td th:text="${op.marketplace.name}">Магазин</td>
    </tr>
    </tbody>
</table>

</body>

<footer>
    <p><input type="button" value="Logout">Выход и прочая навигация</p>
</footer>
</html>
