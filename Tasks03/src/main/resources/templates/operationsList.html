<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Операции</title>
</head>
<body>
<header>
    <h1 th:text="|---Пользователь ${currentUser?.firstName} ${currentUser?.lastName} (${currentUser?.login})---|">Пользователь неизвестен...</h1>
    <!--
    <p>Который сделан на основе готового шаблона</p>
    <nav>
        <ul>
            <li><a href="index.html">Эта страница</a></li>
            <li><a href="catalog.html">Другая страница</a></li>
        </ul>
    </nav>
    -->
</header>

<h2>Добавить новую операцию</h2>

<form th:action="@{/operations/new}" method="post" th:object="${operation}">
    <table border="1">
        <thead>
            <tr>
                <b>
                    <th><label for="id">#</label></th>
                    <th><label for="type">Вид</label></th>
                    <th><label for="amount">Сумма</label></th>
                    <th><label for="category">Категория</label></th>
                    <th><label for="account">Счет</label></th>
                    <th><label for="marketplace">Магазин</label></th>
                    <th><label for="date-time">Дата, время</label></th>
                </b>
            </tr>
        </thead>
        <tbody>
            <tr>

<!--
<span th:each="acc : ${currentUser.accounts}">
            <span th:text="${acc.name}">smth...</span><br>
        </span>
-->
                <td>
                    <input type="text" th:field="*{id}" placeholder="ID, если хотите изменить операцию">
                </td>
                <td>
                    <select id="type" th:field="*{type}">
                        <option value="payment">Покупка</option>
                        <option value="income">Доход</option>
                        <option value="saving">Накопление</option>
                    </select>
                </td>
                <td>
                    <input type="text" th:field="*{amount}" id = "amount" placeholder="Сумма">
                </td>
                <td>
                    <select id="category" name = "caty"><!--th:field="${operation.category.name}"-->
                        <!--option value="">-- Пожалуйста, выберите вариант --</option-->
                        <option th:each="cat : ${catList}"
                                th:value="${cat.name}"
                                th:text="${cat.name}"
                                th:selected="${cat.name == operation?.category?.name}">
                        </option>
                        <!--option value="*{catList.name}"></option-->
                        <!--option value="payment">Покупка</option-->

                    </select>
                </td>
                <td>
                    <select id="account" th:field="*{account}">
                        <option th:each="acc : ${accList}"
                                th:value="${acc.id}"
                                th:text="${acc.name}">
                        </option>
                    </select>
                </td>
                <td>
                    <select id="marketplace" th:field="*{marketplace}">
                        <option th:each="mp : ${mpList}"
                                th:value="${mp.id}"
                                th:text="|${mp.name}, ${mp.address}|"></option>
                    </select>
                </td>
                <td>
                    <input type="datetime-local" name="dt" id="date-time">
                </td>
            </tr>

        </tbody>

    </table><br>
    <input type="submit" value="Создать"> <br>
    <form th:action="@{/operations/fillOperation}" method="post" >

        <label for="id">Введите ID операции для редактирования</label>
        <input type="text" id="id" name="opID" placeholder="ID">
        <button type="submit" formaction="/operations/fillOperation" formmethod="post">Изменить по ID</button>
    </form>
</form>

<br>
<form th:action="@{/operations/newCat}" method="post" th:object="${category}">
    <label for="catName">Добавить новую категорию</label><br>
    <input type="text" id="catName" name="catName" placeholder="Название категории">
    <input type="text" name = "percentage" placeholder="%">
    <select name = "type">
        <option value="payment">Покупка</option>
        <option value="income">Доход</option>
        <option value="saving">Накопление</option>
    </select>

    <input type="submit" th:value="Добавить">
</form>


<h3>------------------------------------------------------------------------------</h3>

<h2>Операции пользователя</h2>

<table border="1">
    <thead>
    <tr>
        <b>
            <th>N</th>
            <th>Дата</th>
            <th>Тип</th>
            <th>Цена</th>
            <th>Категория</th>
            <th>Счет</th>
            <th>Магазин</th>
        </b>
    </tr>
    </thead>
    <tbody>
    <!-- Цикл по списку usersList -->
    <tr th:each="op : ${operations}">
        <td th:text="${op.id}">-1</td>
        <td th:text="${op.dateTime}">Дата/Время</td>
        <td th:text="${op.type}">Расход/Приход</td>
        <td th:text="${op.amount}">Цена</td>
        <td th:text="${op?.category?.name}">Категория</td>
        <td th:text="${op?.account?.name}">Счет</td>
        <td th:text="${op?.marketplace?.name}">Магазин</td>
    </tr>
    </tbody>
</table>
<br>
<table>
    <tr>
        <td>
            <form th:action="@{/analysis/purchases}" method="get">
                <input type="submit" value="Проанализировать расходы">
            </form>
        </td>
        <td>
            <form th:action="@{/analysis/savings}" method="get">
                <input type="submit" value="Обзор накоплений">
            </form>
        </td>
    </tr>

</table>


</body>

<footer>
    <p><input type="button" value="Logout"><br>
        Выход и прочая навигация</p>
</footer>
</html>
