<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация нового пользователя</title>
</head>
<body>
<h1>Добро пожаловать в систему регистрации FINAL!)</h1>
<br>
<b>Введите свои данные</b>
<br><br>
<form th:object="${user}" method="post" th:action = "@{/register}" id="registerForm"> <!--add}"-->
    <label for="login">Login </label>
    <!--Введите уникальный логин:--> <input type="text" name = "login" th:field="*{login}" placeholder="Введите Логин" id="login"/><br>

    <label for="password">Введите пароль </label>
    <input type="password" th:field="*{password}" placeholder="Введите Пароль" id = "password"/><br>

    <label for="confirm">Повторите ввод пароля </label>
    <input type="password" name="confirm" id="confirm" placeholder="Подтвердите пароль"/><br>

    <label for="firstName">Введите имя </label>
    <input type="text" th:field="*{firstName}" name = "firstName" id = "firstName" placeholder="Имя"/><br>

    <label for="lastName">Введите фамилию </label>
    <input type="text" th:field="*{lastName}" name = "lastName" id = "lastName" placeholder="Фамилия"/><br>

    <label for="age">Введите возраст </label>
    <input type="number" th:field="*{age}" placeholder="Возраст"/><br>    <!--name = "age" id = "age" -->

    <!--Введите возраст: <input type="text" th:field="*{age}" value = "Возраст"/><br>-->
    <button type="submit">Создать</button>
</form>

</body>
</html>
